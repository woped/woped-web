<header class="app-bar">
  <img class="app-bar__logo" src="./assets/woped.jpeg" alt="WoPeD logo" />
  <span class="app-bar__title">WoPeD Web</span>
  <span class="app-bar__spacer"></span>
  <a class="app-bar__link" href="https://github.com/woped/WoPeD" target="_blank" rel="noopener" matTooltip="Repository">
    <mat-icon>code</mat-icon>
  </a>
  <a class="app-bar__link" href="https://woped.dhbw-karlsruhe.de/" target="_blank" rel="noopener" matTooltip="Website">
    <mat-icon>public</mat-icon>
  </a>
</header>

<main class="app-content">
  <mat-tab-group mat-stretch-tabs="false" animationDuration="200ms">
    <mat-tab label="Text → Process">
      <div class="tab-body">
        <app-t2p></app-t2p>
      </div>
    </mat-tab>
    <mat-tab label="Process → Text">
      <div class="tab-body">
        <app-p2t></app-p2t>
      </div>
    </mat-tab>
  </mat-tab-group>
</main>
